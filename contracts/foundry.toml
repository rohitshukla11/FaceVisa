# FaceVisaSettlement on Whitechain Sepolia (chain 1874). `forge test`; deploy with script/Deploy.s.sol.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[rpc_endpoints]
whitechain = "${WHITECHAIN_RPC_URL}"

# Blockscout: `forge verify-contract … --verifier blockscout --verifier-url https://explorer.testnet.whitechain.io/api/`
